[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 4294967295
bytecode_hash = "none"

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
base = "${BASE_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
abstract = "${ABSTRACT_RPC_URL}"
shape = "${SHAPE_RPC_URL}"
monad = "${MONAD_RPC_URL}"

[etherscan]
base = {key = "${ETHERSCAN_API_KEY}", chain = 8453}
mainnet = {key = "${ETHERSCAN_API_KEY}", chain = 1}
abstract = {key = "${ETHERSCAN_API_KEY}", chain = 2741}
shape = {key = "${ETHERSCAN_API_KEY}", chain = 360}
monad = {key = "${ETHERSCAN_API_KEY}", chain = 143}
